plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reddot.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.reddot.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            // 用 debug 签名，方便直接安装测试
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
